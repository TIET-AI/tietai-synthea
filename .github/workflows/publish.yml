name: Publish to PyPI

# Publishing is triggered by publishing a GitHub Release (tag e.g. v3.0.0).
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens/secrets.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify release tag matches package version
        run: |
          VER=$(grep -m1 -E '^version *= *"' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $VER | release tag: $TAG"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match pyproject version ($VER). Bump the version or fix the tag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Validate metadata with twine
        run: uvx twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tietai-synthea
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
