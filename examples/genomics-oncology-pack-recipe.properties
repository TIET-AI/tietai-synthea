# Recipe of the committed reference pack (examples/genomics-oncology-pack), GO-61.
#
#   uv run synthea --population 200 --seed 20261017 --age 55-85 --reference-date 20261001 \
#       --genomics-cohort --regenerate-reference -c examples/genomics-oncology-pack-recipe.properties \
#       --output-dir ./out
#
# The full per-patient FHIR export is not needed for the pack and dominates the run time.
exporter.fhir.export = false
generate.modules.enabled = breast_cancer,lung_cancer,colorectal_cancer,prostate_cancer
