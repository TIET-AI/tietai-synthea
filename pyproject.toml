[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthea"
version = "3.0.0"
description = "Synthetic Patient Population Simulator"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Synthea Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "pyyaml>=5.4.0",
    "jsonpath-ng>=1.5.3",
    "fhir.resources>=7.0.0",
    "jinja2>=3.0.0",
    "click>=8.0.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.62.0",
    "jsonschema>=4.0.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
    "configparser>=5.0.0",
    "requests>=2.26.0",
    "lxml>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pre-commit>=2.15.0",
    "pytest-mock>=3.6.0",
    "pytest-asyncio>=0.18.0",
]

physiology = [
    "sbml2python>=0.2.0; sys_platform != 'win32'",
    "sympy>=1.9",
]

visualization = [
    "graphviz>=0.19",
    "plotly>=5.0.0",
]

[project.scripts]
synthea = "synthea.cli:main"

[project.urls]
Homepage = "https://github.com/synthetichealth/synthea"
Documentation = "https://github.com/synthetichealth/synthea/wiki"
"Bug Tracker" = "https://github.com/synthetichealth/synthea/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.csv", "*.properties"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true